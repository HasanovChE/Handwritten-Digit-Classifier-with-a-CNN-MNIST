# k8s/argocd-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mnist-mlops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-username/mnist-mlops-project.git'
    targetRevision: HEAD
    path: helm/mnist-api
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true