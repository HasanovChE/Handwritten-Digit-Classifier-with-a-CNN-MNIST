name: CI Pipeline

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      MODEL_PATH: ${{ github.workspace }}/models/tensorflow_cnn.keras
      CUDA_VISIBLE_DEVICES: -1
      TF_CPP_MIN_LOG_LEVEL: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull model artifacts
        run: |
          git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate TensorFlow model
        run: |
          set -eux
          mkdir -p models
          echo "MODEL_PATH=$MODEL_PATH"
          echo "Running retraining pipeline..."
          
          python retraining_pipeline.py
          echo "Retraining finished."
          echo "Models directory:"
          find models -maxdepth 2 -type f -ls
          echo "Checking model..."
          test -s "$MODEL_PATH"
          echo "Model exists:"
          ls -lh "$MODEL_PATH"

      - name: Run tests with pytest
      
        run: |
          set -eux
          pytest -vv --tb=long --maxfail=1
