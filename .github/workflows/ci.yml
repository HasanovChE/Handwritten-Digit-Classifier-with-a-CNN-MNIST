name: CI Pipeline

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      MODEL_PATH: ${{ github.workspace }}/models/tensorflow_cnn.keras
      CUDA_VISIBLE_DEVICES: -1
      TF_CPP_MIN_LOG_LEVEL: 2

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Pull Git LFS files
      - name: Pull model artifacts
        run: |
          git lfs pull

      # 3. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Retrain TensorFlow CNN model
      - name: Generate TensorFlow model
        run: |
          set -eux

          mkdir -p models

          echo "MODEL_PATH=$MODEL_PATH"

          python retraining_pipeline.py

          echo "Retraining finished."

          echo "Generated model files:"
          find models -maxdepth 2 -type f -ls

          echo "Checking model..."

          test -s "$MODEL_PATH"

          echo "Model successfully generated:"
          ls -lh "$MODEL_PATH"

      # 6. Run tests
      - name: Run tests with pytest
        run: |
          pytest -vv --tb=long --maxfail=1
